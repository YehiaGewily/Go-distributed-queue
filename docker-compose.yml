version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  producer:
    build:
      context: .
      dockerfile: build/producer.Dockerfile
    ports:
      - "8085:8085"
    environment:
      - REDIS_ADDR=redis:6379
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: build/worker.Dockerfile
    ports:
      - "8086:8086"
    environment:
      - REDIS_ADDR=redis:6379
      - WORKER_COUNT=5
      - WORKER_METRICS_ADDR=:8086
    depends_on:
      redis:
        condition: service_healthy

  monitor:
    build:
      context: .
      dockerfile: build/monitor.Dockerfile
    ports:
      - "8082:8082"
    environment:
      - REDIS_ADDR=redis:6379
    depends_on:
      redis:
        condition: service_healthy
